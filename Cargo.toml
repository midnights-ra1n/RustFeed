# cargo compiler instructions file

[package]
name = "RustFeed"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = {version = "1", features = ["full"]}
anyhow = "1"
serde = { version = "1", features = ["derive"]}
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"]}
rss = "2"
serde_json = "1"
axum = "0.8"
toml_edit = "0.25.15"
webauthn-rs = "0.5"
# webauthn-rs needs OpenSSL: vendored so the binary doesn't depend on the system libssl
openssl = { version = "0.10", features = ["vendored"] }
argon2 = "0.5"
getrandom = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
dom_smoothie = "0.18.2"

# .deb package (cargo install cargo-deb && cargo deb): runs as a systemd service,
# data in /var/lib/rustfeed/data, updates from GitHub releases via the web interface.
[package.metadata.deb]
name = "rustfeed"
maintainer = "midnights-ra1n"
extended-description = "Self-hosted RSS reader with Discord and email notifications, managed from a web interface on port 3060."
section = "web"
depends = "$auto, curl, ca-certificates"
maintainer-scripts = "debian/"
assets = [
    ["target/release/RustFeed", "usr/bin/", "755"],
    ["debian/update.sh", "usr/lib/rustfeed/update.sh", "755"],
    ["debian/rustfeed.service", "lib/systemd/system/", "644"],
    ["debian/rustfeed-update.service", "lib/systemd/system/", "644"],
    ["debian/rustfeed-update.path", "lib/systemd/system/", "644"],
]
